<style>
:root {
  --bg:     #0C0907;
  --ink:    #EFE6D8;
  --dim:    rgba(239,230,216,0.42);
  --accent: #F2B36B;
  --line:   rgba(239,230,216,0.10);
  --font:   "IBM Plex Mono", ui-monospace, monospace;
  --serif:  "Outfit", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: radial-gradient(60% 40% at 62% 30%, rgba(242,179,107,0.06) 0%, rgba(242,179,107,0) 70%), radial-gradient(50% 35% at 35% 40%, rgba(239,230,216,0.035) 0%, rgba(239,230,216,0) 70%), var(--bg);
  font-family: var(--font);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
canvas#c, canvas#c2 { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
canvas#c2 { z-index: 6; pointer-events: none; }
a:focus-visible, button:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }

/* vignette: darkens the edges, warm */
.vignette {
  position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 75% 70% at 50% 62%, transparent 45%, rgba(12,9,7,0.92) 100%);
}

/* a whisper of context at the foot */
body:not(.plotted) .hud { opacity: 0 !important; }
.hud { position: fixed; left: 0; right: 0; bottom: clamp(16px, 2.6vh, 26px); text-align: center; pointer-events: none;
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim);
  opacity: 0; animation: fade 1.8s ease 1.4s forwards; }
.hud i { font-style: normal; color: var(--accent); margin: 0 8px; }

/* the name, where the wordmark was */
.center {
  position: fixed; inset: 0; z-index: 3;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
  transform: translateY(-14vh);
}
.wm { text-align: center; opacity: 1; }
.wm .logo circle { opacity: 0; }
body.plotted .wm .logo circle { opacity: 1; }
.wm .payoff { opacity: 0; transition: opacity 1.4s ease; }
body.plotted .wm .payoff { opacity: 1; }
#burger {
  position: fixed; top: 1.5rem; right: 1.8rem; z-index: 10005;
  width: 52px; height: 48px;
  display: grid; place-items: center;
  background: none; border: none; padding: 0; cursor: pointer;
  color: var(--ink);
}
#burger svg { width: 40px; height: 36px; display: block; overflow: visible; }
#burger line {
  stroke: currentColor; stroke-width: 1.2; stroke-linecap: round;
  stroke-dasharray: 30 40; stroke-dashoffset: 0;
  transform-origin: 17px 18px;
  transition: transform .5s cubic-bezier(.16,.84,.44,1), stroke-dasharray .5s ease, opacity .3s;
}
#burger .l2 { stroke-dasharray: 17 40; }
#burger .hd { fill: var(--accent); transition: transform .5s cubic-bezier(.16,.84,.44,1), opacity .3s; filter: drop-shadow(0 0 4px rgba(242,179,107,0.8)); }
/* hover: the head rewrites both lines left to right */
#burger:hover line { animation: rewrite .9s ease both; }
#burger:hover .l2 { animation: rewrite2 .8s ease both .25s; }
@keyframes rewrite { from { stroke-dashoffset: 30; } to { stroke-dashoffset: 0; } }
@keyframes rewrite2 { from { stroke-dashoffset: 17; } to { stroke-dashoffset: 0; } }
/* open: the two lines cross, the head leaves to write the menu */
body.menu-open #burger .l1 { transform: translateY(5px) rotate(45deg); }
body.menu-open #burger .l2 { transform: translateY(-5px) rotate(-45deg); stroke-dasharray: 30 40; }
body.menu-open #burger .hd { opacity: 0; transform: translateX(-12px); }
body.menu-open #burger:hover line { animation: none; }

#menu {
  position: fixed; inset: 0; z-index: 10004;
  pointer-events: none; visibility: hidden;
}
body.menu-open #menu { visibility: visible; }
.lines {
  position: absolute; left: 50%; top: 46%;
  transform: translate(-50%, -50%);
  display: flex; flex-direction: column; gap: 0.35rem;
  pointer-events: auto;
}
.line {
  display: grid; grid-template-columns: minmax(12ch, auto) 1fr; column-gap: 1.6rem; align-items: baseline;
  text-decoration: none; padding: 0.42rem 0;
  min-height: 2.1rem;
}
.line .t { font-family: var(--serif); font-weight: 300; font-size: 1.35rem; letter-spacing: 0.02em; color: var(--ink); white-space: pre; transition: color .3s; }
.line .s { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.1em; color: var(--dim); white-space: pre; opacity: 0; transition: opacity .5s, color .3s; }
.line.written .s { opacity: 1; }
.line:hover .t, .line:focus-visible .t { color: var(--accent); }
.line:hover .s { color: rgba(239,230,216,0.72); }
body.menu-closing .line .t, body.menu-closing .line .s { opacity: 0; transition: opacity .35s; }
.menu-icons {
  position: absolute; left: 0; right: 0; bottom: 5vh;
  display: flex; justify-content: center; gap: 1.8rem; list-style: none;
  pointer-events: auto;
  opacity: 0; transition: opacity .6s .9s;
}
body.menu-open .menu-icons { opacity: 1; }
.menu-icons a { display: block; color: var(--dim); transition: color .25s, transform .25s; }
.menu-icons svg { width: 17px; height: 17px; display: block; }
.menu-icons a:hover { color: var(--accent); transform: translateY(-2px); }
body.menu-open .wm { opacity: 0 !important; transition: opacity .5s; }
body.menu-open .hud { opacity: 0 !important; }
@media (max-width: 768px) {
  .line { grid-template-columns: 1fr; row-gap: 0.1rem; min-height: 2.6rem; padding: 0.3rem 0; }
  .line .t { font-size: 1.15rem; }
  .lines { top: 44%; width: 82vw; }
}

/* ── cookie banner ── */
#cookie-banner {
  position: fixed; left: 50%; bottom: 24px;
  transform: translateX(-50%) translateY(140%);
  z-index: 10000; width: min(92vw, 640px);
  background: rgba(16,12,9,0.97); backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: 6px;
  padding: 1.4rem 1.6rem; display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;
  transition: transform .6s cubic-bezier(.16,.84,.44,1);
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
#cookie-banner.show { transform: translateX(-50%) translateY(0); }
.cookie-text { flex: 1 1 280px; font-size: 0.78rem; line-height: 1.65; color: var(--dim); }
.cookie-text strong { display: block; font-family: var(--serif); font-weight: 400; font-size: 0.98rem; color: var(--ink); margin-bottom: 0.3rem; }
.cookie-text a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(242,179,107,0.35); }
.cookie-actions { display: flex; gap: 0.7rem; flex: 0 0 auto; }
.cookie-btn { font-family: var(--font); font-size: 0.74rem; padding: 0.65rem 1.2rem; border-radius: 4px;
  border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer;
  transition: background .2s, color .2s; white-space: nowrap; }
.cookie-btn.decline { border-color: var(--line); color: var(--dim); }
.cookie-btn.accept:hover { background: var(--accent); color: var(--bg); }
.cookie-btn.decline:hover { border-color: var(--dim); color: var(--ink); }

@media (max-width: 600px) {
  .wm .logo { width: 46vw; }
  .wm .payoff { font-size: 0.7rem; letter-spacing: 0.08em; }
}
@media (max-width: 768px) {
  #burger { top: 0.7rem; right: 0.7rem; }
  #cookie-banner { flex-direction: column; align-items: stretch; bottom: 12px; padding: 1.1rem 1.2rem; gap: 0.9rem; }
  .cookie-text { flex: 0 0 auto; }
  .cookie-actions { justify-content: stretch; }
  .cookie-btn { flex: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .wm { animation: none; opacity: 1; }
}
</style>
</head>

<script>
  (() => {
    'use strict';
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d', { alpha: false });
    const canvas2 = document.getElementById('c2'), ctx2 = canvas2.getContext('2d');
    const DPR = Math.min(2, devicePixelRatio || 1);
    const TOUCH = matchMedia('(pointer: coarse)').matches;
    let W, H, cx, cy, K, COLS, ROWS, XR, mobile;
    const cam_y = 0.75, cam_f = 1.55;

    let reveal = null;
    /* ── the dunes: a still relief, lit by the real sun over Como ── */
    let waveA = 1;
    const LAT = 45.81 * Math.PI / 180, LON = 9.09;
    const params = new URLSearchParams(location.search);
    const HOUR_OVERRIDE = params.has('h') ? parseFloat(params.get('h')) : null;   /* ?h=6.5 simulates 06:30 */

    function sunNow() {
      /* NOAA-style approximation: altitude and azimuth of the sun in Como */
      const now = new Date();
      let d = new Date(now);
      let utcHours = now.getUTCHours() + now.getUTCMinutes() / 60 + now.getUTCSeconds() / 3600;
      if (HOUR_OVERRIDE !== null) {                           /* local hour -> utc (Como is UTC+1/+2) */
        const off = -new Date().getTimezoneOffset() / 60;
        utcHours = HOUR_OVERRIDE - (Intl.DateTimeFormat('it-IT', { timeZone: 'Europe/Rome', timeZoneName: 'short' })
          .formatToParts(now).find(p => p.type === 'timeZoneName').value.includes('+2') ? 2 : 1);
      }
      const start = Date.UTC(d.getUTCFullYear(), 0, 0);
      const doy = (Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - start) / 86400000;
      const g = 2 * Math.PI / 365 * (doy - 1 + (utcHours - 12) / 24);
      const eqt = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
      const decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
      const tst = (utcHours * 60 + eqt + 4 * LON) % 1440;
      const ha = (tst / 4 - 180) * Math.PI / 180;
      const alt = Math.asin(Math.sin(LAT) * Math.sin(decl) + Math.cos(LAT) * Math.cos(decl) * Math.cos(ha));
      let az = Math.acos(((Math.sin(LAT) * Math.cos(ha) * Math.cos(decl)) - Math.cos(LAT) * Math.sin(decl)) / Math.cos(alt) * -1 + 0) ;
      az = Math.atan2(Math.sin(ha), Math.cos(ha) * Math.sin(LAT) - Math.tan(decl) * Math.cos(LAT)) + Math.PI;  /* from north, clockwise */
      return { alt, az };
    }
    let sun = sunNow();
    setInterval(() => { sun = sunNow(); }, 30000);

    function relief(x, z) {
      const d1 = 1 - Math.abs(Math.sin(0.30 * x + 0.16 * z + 0.6 * Math.sin(0.28 * z)));
      return 0.9 * Math.pow(d1, 1.5) + 0.22 * Math.sin(0.9 * x - 0.55 * z + 1.3) + 0.10 * Math.sin(2.1 * x + 1.6 * z);
    }
    const pointer = { x: 0, z: 0, s: 0 };
    let ripple = 0, lastTouch = -1e9;
    function surface(x, z, t) {
      /* the dune, plus a slow sand ripple and the soft print of the pointer */
      const dx = x - pointer.x, dz = z - pointer.z, d = Math.sqrt(dx * dx + dz * dz);
      /* sand ripples that travel with the wind, and a slow breath of the dunes themselves */
      return relief(x, z)
        + 0.085 * Math.sin(3.6 * x + 2.4 * z + t * 0.55)
        + 0.045 * Math.sin(5.1 * x - 1.7 * z - t * 0.8)
        + 0.07 * Math.sin(0.7 * x - 0.35 * z + t * 0.22)
        - Math.exp(-d * d * 1.6) * 0.32 * pointer.s;
    }
    function light() {
      /* light direction in scene space: +x east, +z north (away), +y up */
      const alt = sun.alt, az = sun.az;
      const day = Math.max(0, Math.min(1, (alt + 0.06) / 0.20));           /* 0 at night .. 1 in full day */
      const a = alt > -0.05 ? alt : 0.45;                                   /* at night, a high faint moon */
      const l = [Math.cos(a) * Math.sin(az), Math.sin(a), Math.cos(a) * Math.cos(az)];
      const golden = Math.max(0, 1 - Math.max(0, alt) / 0.5);                /* low sun = warm */
      return { l, day, golden, alt, az };
    }
    function cell(c, r, t) {
      const x = ((c / (COLS - 1)) - 0.5) * XR, z = 0.6 + (r / ROWS) * 9.4;
      const y = surface(x, z, t) * 0.34 - 0.12;
      const pz = z + 0.4;
      return { sx: cx + (x / pz) * K, sy: cy - ((y - cam_y) / pz) * K, y, depth: 1 - r / ROWS, r, x, z };
    }
    function drawWave(t) {
      const L = light();
      const e = 0.004;
      const inkHi = [239, 230, 216], amb = [242, 179, 107];
      for (let r = ROWS - 1; r >= 0; r--) {
        if (reveal && r < reveal.row) break;
        const rowFrac = (reveal && r === reveal.row) ? reveal.frac : 1;
        const fwd = ((ROWS - 1 - r) % 2 === 0);
        for (let c = 0; c < COLS; c++) {
          if (rowFrac < 1) { const cc = fwd ? c : (COLS - 1 - c); if (cc > rowFrac * COLS) continue; }
          const p = cell(c, r, t);
          if (p.sy < -10 || p.sy > H + 10 || p.sx < -10 || p.sx > W + 10) continue;
          /* normal by finite differences */
          const hx = surface(p.x + e, p.z, t) - surface(p.x - e, p.z, t);
          const hz = surface(p.x, p.z + e, t) - surface(p.x, p.z - e, t);
          let nx = -hx / (2 * e), ny = 1, nz = -hz / (2 * e);
          const nl = Math.sqrt(nx * nx + ny * ny + nz * nz); nx /= nl; ny /= nl; nz /= nl;
          const lam = Math.max(0, nx * L.l[0] + ny * L.l[1] + nz * L.l[2]);
          const far = Math.min(1, (1 - p.r / ROWS) * 4);
          const dayI = 0.12 + 0.78 * lam, nightI = 0.09 + 0.24 * lam;
          const inten = (nightI + (dayI - nightI) * L.day) * far * waveA;
          if (inten < 0.035) continue;
          const warm = L.day * L.golden * lam;
          const col = [0, 1, 2].map(i => Math.round(inkHi[i] + (amb[i] - inkHi[i]) * warm));
          const size = (0.6 + p.depth * 1.3 + lam * 0.5) * DPR;
          ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${Math.min(1, inten).toFixed(3)})`;
          ctx.fillRect(p.sx - size / 2, p.sy - size / 2, size, size);
        }
      }
      /* the sky at the horizon glows where the sun is, warm and low */
      const glowI = (L.day * L.golden * 0.9 + (1 - L.day) * 0.08) * skyA;
      if (glowI > 0.02) {
        const gx = cx + Math.sin(L.az) * W * 0.42;
        const hy = cy - ((surface(0, 10, t) * 0.34 - 0.12 - cam_y) / 10.4) * K;
        const g = ctx.createRadialGradient(gx, hy, 0, gx, hy, W * 0.36);
        g.addColorStop(0, `rgba(242,179,107,${(0.22 * glowI).toFixed(3)})`);
        g.addColorStop(1, 'rgba(242,179,107,0)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      }
    }
    function resize() {
      W = canvas.width = Math.round(innerWidth * DPR);
      H = canvas.height = Math.round(innerHeight * DPR);
      cx = W / 2; cy = H / 2;
      mobile = innerWidth <= 768;
      COLS = mobile ? 120 : 200;
      ROWS = mobile ? 60 : 80;
      XR = 20 * Math.max(0.4, Math.min(1, (innerWidth / innerHeight) / 1.6));
      K = cam_f * H * 0.62;
      if (canvas2) { canvas2.width = W; canvas2.height = H; }
      seedSky();
    }

    /* ── the sky: warm dust in depth above the horizon ── */
    let sky = [], skyA = 0;
    const NEARZ = 0.55;
    function seedSky() {
      sky = [];
      const n = mobile ? 700 : 1500, XRS = W / H;
      for (let i = 0; i < n; i++) {
        const z = 0.25 + Math.pow(Math.random(), 1.6) * 2.9;
        sky.push({ x: (Math.random() * 2 - 1) * XRS * 1.6, y: -0.03 - Math.random() * 1.5, z,
          warm: Math.random() < 0.07, ph: Math.random() * 6.28, tw: 0.2 + Math.random() * 0.5,
          vx: (0.010 + Math.random() * 0.006) * (Math.random() < 0.15 ? -1 : 1), vy: (Math.random() - 0.5) * 0.004 });
      }
    }
    let lastSky = 0;
    function drawSky(ts) {
      const dt = Math.min(0.05, (ts - lastSky) / 1000 || 0.016); lastSky = ts;
      const XRS = W / H;
      const horizonY = cy - ((surface(0, 10, 0) * 0.34 - 0.12 - cam_y) / 10.4) * K;
      for (let i = 0; i < sky.length; i++) {
        const g = sky[i];
        g.x += g.vx * dt * 3 / g.z; g.y += g.vy * dt * 3 / g.z;
        if (g.x > XRS * 1.7) g.x = -XRS * 1.7; if (g.x < -XRS * 1.7) g.x = XRS * 1.7;
        if (g.y > -0.03) g.y = -1.5; if (g.y < -1.53) g.y = -0.03;
        const sx = cx + (g.x / g.z) * K * 0.55, sy = cy + (g.y / g.z) * K * 0.55;
        if (sx < -20 || sx > W + 20 || sy < -20 || sy > horizonY - 6 * DPR) continue;
        const depth = 1 - (g.z - 0.25) / 2.9;
        const tw = 0.75 + 0.25 * Math.sin(ts * 0.0004 * g.tw * 40 + g.ph);
        const a = (0.10 + 0.75 * depth * depth) * tw * skyA * waveA;
        const r = (0.5 + 2.4 * depth * depth) * DPR;
        const col = g.warm ? '242,179,107' : '239,230,216';
        const target = g.z < NEARZ ? ctx2 : ctx;
        if (g.z < NEARZ) {
          const gr = target.createRadialGradient(sx, sy, 0, sx, sy, r * 4);
          gr.addColorStop(0, `rgba(${col},${(a * 0.55).toFixed(3)})`); gr.addColorStop(1, `rgba(${col},0)`);
          target.fillStyle = gr; target.beginPath(); target.arc(sx, sy, r * 4, 0, Math.PI * 2); target.fill();
        }
        target.fillStyle = `rgba(${col},${Math.min(1, a).toFixed(3)})`;
        target.beginPath(); target.arc(sx, sy, r, 0, Math.PI * 2); target.fill();
      }
    }

    /* ── the matter: particles that live on the wave and can become words ── */
    let particles = [], voices = [], menuOpen = false, menuT = 0, hoverVoice = -1;
    const TITLES = ['Poi ti racconto', 'Linea di volo', 'Quota Zero', 'Formula Tre', 'Rotta', 'ISS Deck'];

    function sampleText(text, fontPx, pitch) {
      const off = document.createElement('canvas'); const o = off.getContext('2d');
      o.font = `500 ${fontPx}px Outfit, "Helvetica Neue", Arial, sans-serif`;
      const w = Math.ceil(o.measureText(text).width) + 8, h = Math.ceil(fontPx * 1.3);
      off.width = w; off.height = h;
      o.font = `500 ${fontPx}px Outfit, "Helvetica Neue", Arial, sans-serif`;
      o.fillStyle = '#fff'; o.textBaseline = 'middle'; o.fillText(text, 4, h / 2);
      const d = o.getImageData(0, 0, w, h).data, pts = [];
      for (let y = pitch / 2; y < h; y += pitch) for (let x = pitch / 2; x < w; x += pitch) {
        if (d[((y | 0) * w + (x | 0)) * 4 + 3] > 120) pts.push([x - w / 2, y - h / 2]);
      }
      return { pts, w, h };
    }

    function buildMatter() {
      const fontPx = (mobile ? 30 : 46) * DPR, pitch = (mobile ? 3.0 : 3.6) * DPR;
      const gap = (mobile ? 64 : 92) * DPR;
      const total = TITLES.length * gap;
      const top = H / 2 - total / 2 + gap * 0.5 - (mobile ? H * 0.04 : H * 0.03);
      voices = []; particles = [];
      TITLES.forEach((t, i) => {
        const s = sampleText(t, fontPx, pitch);
        const yC = top + i * gap;
        voices.push({ x: cx, y: yC, w: s.w, h: s.h, from: particles.length, to: particles.length + s.pts.length });
        s.pts.forEach(([px, py]) => {
          particles.push({
            tx: cx + px, ty: yC + py,                    /* where it stands in the menu */
            c: Math.floor(Math.random() * COLS),          /* its cell on the wave */
            r: Math.floor(ROWS * (0.35 + 0.65 * Math.random())),
            d: Math.random() * 0.35,                      /* start delay */
            arc: (0.4 + Math.random() * 0.8) * H * 0.06,  /* how much it lifts on the way */
            v: i
          });
        });
      });
      /* place the HTML hit-areas over the dot-titles */
      document.querySelectorAll('.voice').forEach((el, i) => {
        const v = voices[i];
        el.style.setProperty('--vx', (v.x - v.w / 2) / DPR + 'px');
        el.style.setProperty('--vy', (v.y - v.h / 2) / DPR + 'px');
        el.style.setProperty('--vw', v.w / DPR + 'px');
        el.style.setProperty('--vh', v.h / DPR + 'px');
      });
    }

    const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    function drawMatter(t, dt) {
      menuT = Math.max(0, Math.min(1, menuT + (menuOpen ? 1 : -1) * dt / 0.9));
      waveA = 1 - 0.7 * ease(menuT);
      if (menuHead) head(menuHead.x, menuHead.y, 1);
      return;
      const size = (mobile ? 1.5 : 1.7) * DPR;
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const k = ease(Math.max(0, Math.min(1, (menuT - p.d) / (1 - 0.35))));
        if (k <= 0) continue;
        const home = cell(p.c, p.r, t);
        const x = home.sx + (p.tx - home.sx) * k;
        const y = home.sy + (p.ty - home.sy) * k - Math.sin(k * Math.PI) * p.arc;
        const hot = hoverVoice === p.v;
        const a = 0.35 + 0.65 * k;
        ctx.fillStyle = hot ? `rgba(242,179,107,${a})` : `rgba(239,230,216,${(a * 0.92).toFixed(3)})`;
        const s = size * (hot ? 1.25 : 1);
        ctx.fillRect(x - s / 2, y - s / 2, s, s);
      }
    }

    /* ── pointer on the water ── */
    function toScene(px, py) {
      const nx = (px * DPR - cx) / K, ny = (cy - py * DPR) / K;
      const z = Math.max(0.6, Math.min(10, cam_y / Math.max(0.05, -ny) - 0.4));
      pointer.x = nx * (z + 0.4); pointer.z = z; pointer.s = 1;
    }
    addEventListener('pointermove', e => { toScene(e.clientX, e.clientY); lastTouch = performance.now(); }, { passive: true });
    addEventListener('pointerdown', e => { toScene(e.clientX, e.clientY); lastTouch = performance.now(); }, { passive: true });
    function autoPointer(ts) {
      if (!TOUCH || ts - lastTouch < 3000) return;
      pointer.x = Math.sin(ts * 0.00018) * XR * 0.35; pointer.z = 2.2 + Math.sin(ts * 0.00011) * 1.4; pointer.s = 0.8;
    }

    /* ── public hooks for the menu ── */
    window.__materia = {
      menu(on) { menuOpen = on; },
      hover(i) { hoverVoice = i; }
    };
    /* the menu writer asks for the head at the end of the line being written */
    let menuHead = null;
    window.__head = function (el, n) {
      if (!el) { menuHead = null; return; }
      const r = el.getBoundingClientRect();
      const meas = document.createElement('canvas').getContext('2d');
      meas.font = getComputedStyle(el).font;
      const w = meas.measureText(el.textContent).width;
      menuHead = { x: (r.left + w + 2) * DPR, y: (r.top + r.height * 0.62) * DPR };
    };

    addEventListener('resize', resize);
    resize();

    /* ── the plotter ── */
    const logoSvg = document.querySelector('.wm .logo');
    const dots = logoSvg ? Array.from(logoSvg.querySelectorAll('circle')) : [];
    const solidG = logoSvg ? logoSvg.querySelector('g[clip-path]') : null;
    let plotStart = null, plotDone = sessionStorage.getItem('gr_plot') === '1', drawnDots = 0, clipRect = null;
    const T = { solidA: 0.3, solidB: 1.6, dotsB: 4.2, travelB: 4.8, waveB: 8.6 };
    function setupPlotter() {
      canvas2.width = W; canvas2.height = H;
      if (plotDone || !logoSvg || !solidG) { finishPlot(); return; }
      const NS = 'http://www.w3.org/2000/svg';
      const defs = logoSvg.querySelector('defs') || logoSvg.insertBefore(document.createElementNS(NS, 'defs'), logoSvg.firstChild);
      const cp = document.createElementNS(NS, 'clipPath'); cp.setAttribute('id', 'plot');
      clipRect = document.createElementNS(NS, 'rect');
      const vb = logoSvg.viewBox.baseVal;
      clipRect.setAttribute('x', vb.x); clipRect.setAttribute('y', vb.y); clipRect.setAttribute('width', 0); clipRect.setAttribute('height', vb.height);
      cp.appendChild(clipRect); defs.appendChild(cp);
      const wrap = document.createElementNS(NS, 'g'); wrap.setAttribute('clip-path', 'url(#plot)');
      solidG.parentNode.insertBefore(wrap, solidG); wrap.appendChild(solidG);
      reveal = { row: ROWS, frac: 0 };
      plotStart = null;
    }
    function finishPlot() {
      plotDone = true; reveal = null; sessionStorage.setItem('gr_plot', '1');
      if (clipRect) clipRect.setAttribute('width', 99999);
      document.body.classList.add('plotted');
      skyA = Math.max(skyA, 0.001);
    }
    addEventListener('pointerdown', () => { if (!plotDone) finishPlot(); }, { passive: true });
    window.__finishPlot = function () { if (!plotDone) finishPlot(); };
    document.addEventListener('keydown', () => { if (!plotDone) finishPlot(); });
    function head(x, y, glow) {
      const r = 14 * DPR;
      const g = ctx2.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(242,179,107,${(0.55 * glow).toFixed(3)})`); g.addColorStop(1, 'rgba(242,179,107,0)');
      ctx2.fillStyle = g; ctx2.beginPath(); ctx2.arc(x, y, r, 0, Math.PI * 2); ctx2.fill();
      ctx2.fillStyle = `rgba(255,252,246,${glow.toFixed(3)})`; ctx2.beginPath(); ctx2.arc(x, y, 2.2 * DPR, 0, Math.PI * 2); ctx2.fill();
    }
    function plot(ts) {
      if (plotStart === null) plotStart = ts;
      const s = (ts - plotStart) / 1000;
      const box = logoSvg.getBoundingClientRect(), vb = logoSvg.viewBox.baseVal;
      const toX = vx => (box.left + (vx - vb.x) / vb.width * box.width) * DPR;
      const toY = vy => (box.top + (vy - vb.y) / vb.height * box.height) * DPR;
      const solidEnd = dots.length ? parseFloat(dots[0].getAttribute('cx')) : vb.x + vb.width;
      if (s < T.solidA) { return 0; }
      if (s < T.solidB) {                                              /* writing the solid letters */
        const k = (s - T.solidA) / (T.solidB - T.solidA), e = k < 0.5 ? 2 * k * k : -1 + (4 - 2 * k) * k;
        const vx = vb.x + (solidEnd - vb.x) * e;
        clipRect.setAttribute('width', vx - vb.x);
        head(toX(vx), toY(vb.y + vb.height * 0.62), 1);
        return 0;
      }
      if (s < T.dotsB) {                                               /* the dots, one by one, in order */
        clipRect.setAttribute('width', 99999);
        const k = (s - T.solidB) / (T.dotsB - T.solidB);
        const n = Math.floor(k * dots.length);
        for (; drawnDots < n; drawnDots++) dots[drawnDots].style.opacity = 1;
        const d = dots[Math.max(0, Math.min(dots.length - 1, n))];
        head(toX(parseFloat(d.getAttribute('cx'))), toY(parseFloat(d.getAttribute('cy'))), 1);
        return 0;
      }
      for (; drawnDots < dots.length; drawnDots++) dots[drawnDots].style.opacity = 1;
      if (s < T.travelB) {                                             /* down to the horizon */
        const k = (s - T.dotsB) / (T.travelB - T.dotsB), e = k * k * (3 - 2 * k);
        const last = dots[dots.length - 1];
        const x0 = toX(parseFloat(last.getAttribute('cx'))), y0 = toY(parseFloat(last.getAttribute('cy')));
        const p1 = cell(0, ROWS - 1, 0);
        head(x0 + (p1.sx - x0) * e, y0 + (p1.sy - y0) * e, 1);
        return 0;
      }
      if (s < T.waveB) {                                               /* tracing the sea, far to near */
        const k = (s - T.travelB) / (T.waveB - T.travelB);
        const rowsDone = k * ROWS;
        const row = ROWS - 1 - Math.floor(rowsDone), frac = rowsDone - Math.floor(rowsDone);
        reveal = { row: Math.max(0, row), frac };
        const fwd = ((ROWS - 1 - row) % 2 === 0);
        const col = Math.floor((fwd ? frac : 1 - frac) * (COLS - 1));
        const p = cell(col, Math.max(0, row), 0);
        head(p.sx, p.sy, 1);
        return 0;
      }
      finishPlot();
      return 0;
    }

    const hud = document.getElementById('hud');
    function updateHud() {
      const L = light();
      const hh = HOUR_OVERRIDE !== null ? (Math.floor(HOUR_OVERRIDE) + ':' + String(Math.round((HOUR_OVERRIDE % 1) * 60)).padStart(2, '0')) : new Intl.DateTimeFormat('it-IT', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Rome' }).format(new Date());
      const deg = Math.round(L.alt * 180 / Math.PI);
      hud.innerHTML = 'Como ' + hh + '<i>&middot;</i>' + (deg > 0 ? 'sole a ' + deg + '&deg;' : 'notte');
    }
    updateHud(); setInterval(updateHud, 30000);

    let last = 0, waveT0 = null;
    function frame(ts) {
      const dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
      if (!plotDone) { plot(ts); }
      if (plotDone && waveT0 === null) waveT0 = ts;
      const t = plotDone ? (ts - waveT0) * 0.00035 : 0;
      autoPointer(ts);
      if (!TOUCH || ts - lastTouch < 3000) pointer.s *= 0.97;
      ctx.fillStyle = '#0C0907'; ctx.fillRect(0, 0, W, H);
      ctx2.clearRect(0, 0, W, H);
      /* the sky fills in while the sea is being traced */
      skyA = plotDone ? Math.min(1, skyA + dt / 2.5) : (plotStart === null ? 0 : Math.min(1, Math.max(0, ((ts - plotStart) / 1000 - T.dotsB) / 3.2)));
      drawWave(t);
      drawSky(ts);
      drawMatter(t, dt);
      requestAnimationFrame(frame);
    }
    setupPlotter();
    requestAnimationFrame(frame);
  })();
</script>
<script>
'use strict';
/* ════════════════════════════════════
   MENU: the plotter writes the lines
   ════════════════════════════════════ */
(function () {
  var burger = document.getElementById('burger');
  var lines = Array.from(document.querySelectorAll('.line'));
  var writing = null, raf = null;

  function write() {
    var t0 = null, total = 0, plan = [];
    lines.forEach(function (el) {
      var t = el.dataset.t, s = el.dataset.s;
      plan.push({ el: el, t: t, s: s, start: total }); total += t.length * 0.03 + 0.12;
    });
    lines.forEach(function (el) { el.classList.remove('written'); el.querySelector('.t').textContent = ''; el.querySelector('.s').textContent = ''; });
    function step(ts) {
      if (t0 === null) t0 = ts;
      var s = (ts - t0) / 1000, headEl = null, headN = 0;
      plan.forEach(function (p) {
        var k = Math.max(0, Math.min(1, (s - p.start) / (p.t.length * 0.03)));
        var n = Math.round(k * p.t.length);
        p.el.querySelector('.t').textContent = p.t.slice(0, n);
        if (k >= 1 && !p.el.classList.contains('written')) { p.el.classList.add('written'); p.el.querySelector('.s').textContent = p.s; }
        if (k > 0 && k < 1) { headEl = p.el.querySelector('.t'); headN = n; }
      });
      if (window.__head) window.__head(headEl, headN);
      if (s < total + 0.2 && document.body.classList.contains('menu-open')) raf = requestAnimationFrame(step);
      else if (window.__head) window.__head(null, 0);
    }
    raf = requestAnimationFrame(step);
  }

  function open() {
    if (window.__finishPlot) window.__finishPlot();
    document.body.classList.add('plotted');
    document.body.classList.remove('menu-closing');
    document.body.classList.add('menu-open');
    burger.setAttribute('aria-expanded', 'true'); burger.setAttribute('aria-label', 'Chiudi il menu');
    window.__materia.menu(true);
    write();
  }
  function close() {
    if (!document.body.classList.contains('menu-open')) return;
    document.body.classList.add('menu-closing');
    burger.setAttribute('aria-expanded', 'false'); burger.setAttribute('aria-label', 'Apri il menu');
    window.__materia.menu(false);
    if (window.__head) window.__head(null, 0);
    setTimeout(function () { document.body.classList.remove('menu-open'); document.body.classList.remove('menu-closing'); }, 380);
  }
  burger.addEventListener('click', function () { document.body.classList.contains('menu-open') ? close() : open(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  window.__closeMenu = close;
})();

/* ════════════════════════════════════
   COOKIE CONSENT
   ════════════════════════════════════ */
(function () {
  var banner  = document.getElementById('cookie-banner');
  var accept  = document.getElementById('cookie-accept');
  var decline = document.getElementById('cookie-decline');
  var reopen  = document.getElementById('cookie-reopen');
  var KEY = 'gr_cookie_consent';

  function store(val) { try { localStorage.setItem(KEY, val); } catch (e) {} }
  function getStored() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function show() { banner.classList.add('show'); }
  function hide() { banner.classList.remove('show'); }

  accept.addEventListener('click', function () {
    store('granted');
    if (typeof gtag === 'function') gtag('consent', 'update', { 'analytics_storage': 'granted' });
    hide();
  });
  decline.addEventListener('click', function () {
    store('denied');
    if (typeof gtag === 'function') gtag('consent', 'update', { 'analytics_storage': 'denied' });
    hide();
  });
  reopen.addEventListener('click', function (e) {
    e.preventDefault();
    if (window.__closeMenu) window.__closeMenu();
    setTimeout(show, 380);
  });

  if (!getStored()) setTimeout(show, 1800);
})();

</script>
</body>
