<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:     #0C0907;
  --ink:    #EFE6D8;
  --dim:    rgba(239,230,216,0.48);
  --accent: #F2B36B;
  --line:   rgba(239,230,216,0.10);
  --mono:   "IBM Plex Mono", ui-monospace, monospace;
  --serif:  "Outfit", "Helvetica Neue", Arial, sans-serif;
  --sans:   "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
}
html { background: var(--bg); }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-weight: 300;
  min-height: 100vh;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }

/* the water at the bottom of the page */
#c { position: fixed; left: 0; right: 0; bottom: 0; height: 38vh; width: 100%; z-index: 0; pointer-events: none; display: block; }
.vignette { position: fixed; left: 0; right: 0; bottom: 0; height: 38vh; z-index: 0; pointer-events: none;
  background: linear-gradient(180deg, var(--bg) 0%, rgba(12,9,7,0) 45%), radial-gradient(ellipse 80% 90% at 50% 100%, transparent 50%, rgba(12,9,7,0.9) 100%); }

.wrap { position: relative; z-index: 1; max-width: 660px; margin: 0 auto; padding: 4.5rem 1.75rem 40vh; }
.back { display: inline-flex; align-items: center; gap: 0.55rem; font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.06em;
  color: var(--dim); text-decoration: none; margin-bottom: 3rem; transition: color .2s, gap .25s; }
.back:hover { color: var(--accent); gap: 0.9rem; }
h1 { font-family: var(--serif); font-weight: 300; letter-spacing: 0.01em; font-size: clamp(2rem, 4.4vw, 2.8rem); line-height: 1.1; letter-spacing: 0.01em; }
.updated { margin-top: 0.5rem; font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.04em; color: var(--dim); }
.rule { width: 34px; height: 1px; background: linear-gradient(90deg, var(--accent), transparent); margin: 1.5rem 0 2.2rem; }
h2 { font-family: var(--serif); font-weight: 400; font-size: 1.35rem; margin: 2.4rem 0 0.6rem; color: var(--ink); }
p { font-size: 0.96rem; color: rgba(239,230,216,0.82); }
p + p { margin-top: 0.9rem; }
.muted { color: var(--dim); font-size: 0.88rem; }
ul { padding-left: 1.2rem; margin: 0.6rem 0; }
li { font-size: 0.96rem; color: rgba(239,230,216,0.82); margin: 0.3rem 0; }
strong { font-weight: 500; color: var(--ink); }
a.inline { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(242,179,107,0.35); }
a.inline:hover { color: var(--ink); border-color: var(--ink); }
table { width: 100%; border-collapse: collapse; margin: 1rem 0 1.4rem; font-size: 0.9rem; }
th, td { text-align: left; padding: 0.7rem 0.6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--mono); font-weight: 400; color: var(--dim); font-size: 0.7rem; letter-spacing: 0.06em; }
td { color: rgba(239,230,216,0.85); }
footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1; text-align: center; padding: 1.2rem;
  font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.06em; color: var(--dim); }
footer a { color: var(--dim); text-decoration: none; }
footer a:hover { color: var(--accent); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.wrap { animation: fadeUp .8s ease both; }
@media (prefers-reduced-motion: reduce) { .wrap { animation: none; } }
@media (max-width: 560px) { .wrap { padding: 3.2rem 1.4rem 42vh; } th, td { padding: 0.6rem 0.4rem; } }

.intro { font-family: var(--serif); font-weight: 300; font-size: 1.05rem; color: var(--dim); line-height: 1.7; margin-bottom: 2.6rem; max-width: 480px; }
form { display: flex; flex-direction: column; gap: 1.8rem; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
.field { display: flex; flex-direction: column; gap: 0.45rem; }
label { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.06em; color: var(--dim); }
input, textarea { background: transparent; border: none; border-bottom: 1px solid var(--line); color: var(--ink);
  font-family: var(--serif); font-weight: 300; font-size: 1.15rem; padding: 0.45rem 2px 0.6rem; outline: none; border-radius: 0; transition: border-color .3s; }
textarea { resize: vertical; min-height: 130px; line-height: 1.6; }
input:focus, textarea:focus { border-bottom-color: var(--accent); }
button[type="submit"] { align-self: flex-start; margin-top: 0.4rem; font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.06em;
  padding: 0.8rem 1.8rem; border-radius: 4px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; transition: background .25s, color .25s; }
button[type="submit"]:hover { background: var(--accent); color: var(--bg); }
#form-status { font-family: var(--serif); font-weight: 300; font-size: 1rem; min-height: 1.4em; }
#form-status.ok  { color: var(--accent); }
#form-status.err { color: #E07A6E; }
@media (max-width: 560px) { .row { grid-template-columns: 1fr; gap: 1.8rem; } button[type="submit"] { align-self: stretch; } }

<body>

<div class="wrap">
  <a class="back" href="/">&larr; Torna alla home</a>

  <h1>Contattami</h1>
  <div class="rule"></div>
  <p class="intro">Scrivimi pure: che sia per un progetto, una domanda o solo per scambiare due parole, questo è il posto giusto.</p>

  <form id="contact-form" action="https://formspree.io/f/mdaqwjwz" method="POST">
    <div class="row">
      <div class="field">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" autocomplete="given-name" required>
      </div>
      <div class="field">
        <label for="cognome">Cognome</label>
        <input type="text" id="cognome" name="cognome" autocomplete="family-name" required>
      </div>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="messaggio">Messaggio</label>
      <textarea id="messaggio" name="messaggio" required></textarea>
    </div>
    <input type="hidden" name="_subject" value="Nuovo messaggio da gioriva.it">
    <p id="form-status" aria-live="polite"></p>
    <button type="submit">Invia il messaggio</button>
  </form>
</div>

<canvas id="c" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<script>
  (() => {
    'use strict';
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d', { alpha: false });
    const DPR = Math.min(2, devicePixelRatio || 1);
    let W, H, cx, cy, K, COLS, ROWS, XR, mobile, waveA = 1;
    const cam_y = 0.75, cam_f = 1.55;
    const LAT = 45.81 * Math.PI / 180, LON = 9.09;
    const HOUR_OVERRIDE = null;
    function sunNow() {
      /* NOAA-style approximation: altitude and azimuth of the sun in Como */
      const now = new Date();
      let d = new Date(now);
      let utcHours = now.getUTCHours() + now.getUTCMinutes() / 60 + now.getUTCSeconds() / 3600;
      if (HOUR_OVERRIDE !== null) {                           /* local hour -> utc (Como is UTC+1/+2) */
        const off = -new Date().getTimezoneOffset() / 60;
        utcHours = HOUR_OVERRIDE - (Intl.DateTimeFormat('it-IT', { timeZone: 'Europe/Rome', timeZoneName: 'short' })
          .formatToParts(now).find(p => p.type === 'timeZoneName').value.includes('+2') ? 2 : 1);
      }
      const start = Date.UTC(d.getUTCFullYear(), 0, 0);
      const doy = (Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - start) / 86400000;
      const g = 2 * Math.PI / 365 * (doy - 1 + (utcHours - 12) / 24);
      const eqt = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
      const decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
      const tst = (utcHours * 60 + eqt + 4 * LON) % 1440;
      const ha = (tst / 4 - 180) * Math.PI / 180;
      const alt = Math.asin(Math.sin(LAT) * Math.sin(decl) + Math.cos(LAT) * Math.cos(decl) * Math.cos(ha));
      const az = Math.atan2(Math.sin(ha), Math.cos(ha) * Math.sin(LAT) - Math.tan(decl) * Math.cos(LAT)) + Math.PI;  /* from north, clockwise */
      return { alt, az };
    }
    let sun = sunNow();
    setInterval(() => { sun = sunNow(); }, 30000);

    function relief(x, z) {
      const d1 = 1 - Math.abs(Math.sin(0.30 * x + 0.16 * z + 0.6 * Math.sin(0.28 * z)));
      return 0.9 * Math.pow(d1, 1.5) + 0.22 * Math.sin(0.9 * x - 0.55 * z + 1.3) + 0.10 * Math.sin(2.1 * x + 1.6 * z);
    }
    const pointer = { x: 0, z: 0, s: 0 };
    let ripple = 0, lastTouch = -1e9;
    function surface(x, z, t) {
      /* the dune, plus a slow sand ripple and the soft print of the pointer */
      const dx = x - pointer.x, dz = z - pointer.z, d = Math.sqrt(dx * dx + dz * dz);
      /* sand ripples that travel with the wind, and a slow breath of the dunes themselves */
      return relief(x, z)
        + 0.085 * Math.sin(3.6 * x + 2.4 * z + t * 0.55)
        + 0.045 * Math.sin(5.1 * x - 1.7 * z - t * 0.8)
        + 0.07 * Math.sin(0.7 * x - 0.35 * z + t * 0.22)
        - Math.exp(-d * d * 1.6) * 0.32 * pointer.s;
    }
    function light() {
      /* light direction in scene space: +x east, +z north (away), +y up */
      const alt = sun.alt, az = sun.az;
      const day = Math.max(0, Math.min(1, (alt + 0.06) / 0.20));           /* 0 at night .. 1 in full day */
      const a = alt > -0.05 ? alt : 0.45;                                   /* at night, a high faint moon */
      const l = [Math.cos(a) * Math.sin(az), Math.sin(a), Math.cos(a) * Math.cos(az)];
      const golden = Math.max(0, 1 - Math.max(0, alt) / 0.5);                /* low sun = warm */
      return { l, day, golden, alt, az };
    }
    function cell(c, r, t) {
      const x = ((c / (COLS - 1)) - 0.5) * XR, z = 0.6 + (r / ROWS) * 9.4;
      const y = surface(x, z, t) * 0.34 - 0.12;
      const pz = z + 0.4;
      return { sx: cx + (x / pz) * K, sy: cy - ((y - cam_y) / pz) * K, y, depth: 1 - r / ROWS, r, x, z };
    }
    function drawWave(t) {
      const L = light();
      const e = 0.004;
      const inkHi = [239, 230, 216], amb = [242, 179, 107];
      for (let r = ROWS - 1; r >= 0; r--) {
        for (let c = 0; c < COLS; c++) {
          const p = cell(c, r, t);
          if (p.sy < -10 || p.sy > H + 10 || p.sx < -10 || p.sx > W + 10) continue;
          /* normal by finite differences */
          const hx = surface(p.x + e, p.z, t) - surface(p.x - e, p.z, t);
          const hz = surface(p.x, p.z + e, t) - surface(p.x, p.z - e, t);
          let nx = -hx / (2 * e), ny = 1, nz = -hz / (2 * e);
          const nl = Math.sqrt(nx * nx + ny * ny + nz * nz); nx /= nl; ny /= nl; nz /= nl;
          const lam = Math.max(0, nx * L.l[0] + ny * L.l[1] + nz * L.l[2]);
          const far = Math.min(1, (1 - p.r / ROWS) * 4);
          const dayI = 0.12 + 0.78 * lam, nightI = 0.09 + 0.24 * lam;
          const inten = (nightI + (dayI - nightI) * L.day) * far * waveA;
          if (inten < 0.035) continue;
          const warm = L.day * L.golden * lam;
          const col = [0, 1, 2].map(i => Math.round(inkHi[i] + (amb[i] - inkHi[i]) * warm));
          const size = (0.6 + p.depth * 1.3 + lam * 0.5) * DPR;
          ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${Math.min(1, inten).toFixed(3)})`;
          ctx.fillRect(p.sx - size / 2, p.sy - size / 2, size, size);
        }
      }
      /* the sky at the horizon glows where the sun is, warm and low */
      const glowI = (L.day * L.golden * 0.9 + (1 - L.day) * 0.08) ;
      if (glowI > 0.02) {
        const gx = cx + Math.sin(L.az) * W * 0.42;
        const hy = cy - ((surface(0, 10, t) * 0.34 - 0.12 - cam_y) / 10.4) * K;
        const g = ctx.createRadialGradient(gx, hy, 0, gx, hy, W * 0.36);
        g.addColorStop(0, `rgba(242,179,107,${(0.22 * glowI).toFixed(3)})`);
        g.addColorStop(1, 'rgba(242,179,107,0)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      }
    }

    function resize() {
      W = canvas.width = Math.round(innerWidth * DPR);
      H = canvas.height = Math.round(canvas.clientHeight * DPR);
      cx = W / 2; cy = H * 0.42;
      mobile = innerWidth <= 768;
      COLS = mobile ? 110 : 170; ROWS = mobile ? 34 : 44;
      XR = 20 * Math.max(0.4, Math.min(1, (innerWidth / (canvas.clientHeight * 2.4)) / 1.6));
      K = cam_f * H * 1.15;
    }
    addEventListener('resize', resize); resize();
    let t0 = null;
    function frame(ts) {
      if (t0 === null) t0 = ts;
      const t = (ts - t0) * 0.00035;
      ctx.fillStyle = '#0C0907'; ctx.fillRect(0, 0, W, H);
      drawWave(t);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
</script>
</body>
